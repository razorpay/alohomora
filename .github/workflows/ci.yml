name: Tests
on: [ push ]
jobs:
  tests:
    runs-on: ubuntu-latest # nosemgrep : semgrep.dev/s/swati31196:github_provided_runner
    continue-on-error: true
    name: Tests
    # Only supported versions are supported: https://endoflife.date/python
    # But tests are run on more.
    strategy:
      matrix:
        python: ["3.7", "3.8", "3.9", "3.10"]
    steps:
      - uses: actions/checkout@v3
      - name: Setup PMG proxy
        uses: safedep/pmg@v1
        with:
          server-mode: true
          api-key: ${{ secrets.PMG_PUBLIC_REPOS_TOKEN }}
          tenant-id: ${{ secrets.PMG_TENANT_ID }}
      - uses: actions/setup-python@v4
        with:
          python-version: ${{matrix.python}}
      - name: Install Dependencies
        run: |
          pip install -U setuptools pip
          python setup.py clean --all
          python setup.py install
      - name: Run Tests
        run: python setup.py test
      - name: Enforce PMG policy
        if: always()
        run: pmg proxy stop --fail-on-violation
